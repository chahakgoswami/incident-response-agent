[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "incident-agent"
version = "0.1.0"
description = "AI agent that correlates alerts/logs, drafts post-mortems, and suggests rollbacks for on-call engineers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Incident Agent Dev", email = "dev@example.com" }
]
keywords = ["incident-response", "sre", "observability", "on-call"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
llm = [
    "openai>=1.0",
]

[project.scripts]
incident-agent = "incident_agent.cli.main:cli"

[project.urls]
"Homepage" = "https://github.com/example/incident-agent"
"Bug Tracker" = "https://github.com/example/incident-agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["incident_agent*"]

[tool.setuptools.package-data]
"incident_agent" = ["config/*.toml", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["incident_agent"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
